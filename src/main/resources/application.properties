spring.application.name=API-BairrOn

spring.datasource.url=jdbc:h2:file:./data/bairron
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

management.info.env.enabled=true
info.app.name=API BairrOn
info.app.description=Mapa colaborativo de problemas do bairro, com prioridade calculada e confirmação dos moradores
info.app.version=1.0.0

management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true

bairron.jwt.secret=${JWT_SECRET:chave-apenas-para-desenvolvimento-local-0123456789}
bairron.jwt.expiracao-minutos=60

bairron.cors.origens=*